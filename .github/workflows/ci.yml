name: CI

on:
  pull_request:
    branches: [testing/commerce-deployment, main]
    # `labeled` as well as the defaults, so adding run-e2e starts the
    # end-to-end jobs without needing an empty commit
    types: [opened, synchronize, reopened, labeled]
    # Nothing here changes what the app serves
    paths-ignore: ["**/*.md", "LICENSE", ".gitignore", ".gitattributes"]
  push:
    branches: [testing/commerce-deployment, main]

# A newer push to the same branch makes an in-flight run redundant
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # The lockfile is pnpm 12; package.json sets engines.node >= 20.12
  PNPM_VERSION: "12"
  NODE_VERSION: "22"

jobs:
  typecheck:
    name: Type check
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # tsconfig pulls in next-env.d.ts and .next/types, which only exist once
      # Next has generated them. typegen does that without a build and without
      # any application environment variables.
      - run: pnpm exec next typegen
      - run: pnpm exec tsc --noEmit

  unit:
    name: Unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Vitest runs offline against pure functions: no store, no database, so
      # unlike the end-to-end job this needs no secrets and always runs.
      - run: pnpm test:unit

  format:
    name: Prettier
    # Pull requests only: this checks the files a change touches, which needs a
    # base to diff against. Repo-wide formatting is not clean yet, so checking
    # everything here would fail on files this change never looked at.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v6
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Check formatting of changed files
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          changed=$(git diff --name-only --diff-filter=d "$BASE_SHA" "$HEAD_SHA")
          if [ -z "$changed" ]; then
            echo "No files changed."
            exit 0
          fi
          echo "$changed"
          # NUL-separated so a path with a space survives, and portable: xargs
          # -0 works everywhere, unlike mapfile, which needs bash 4+
          echo "$changed" | tr '\n' '\0' \
            | xargs -0 pnpm exec prettier --check --ignore-unknown

  # Decides once whether the end-to-end jobs can run. Without a reachable
  # store the suite fails rather than skipping, so it doesn't start at all.
  e2e-guard:
    name: End-to-end setup check
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      configured: ${{ steps.guard.outputs.configured }}
    steps:
      - name: Check whether Shopify is configured
        id: guard
        env:
          STORE_DOMAIN: ${{ secrets.SHOPIFY_STORE_DOMAIN }}
          STOREFRONT_TOKEN: ${{ secrets.SHOPIFY_STOREFRONT_ACCESS_TOKEN }}
          # On a pull request the suite runs only when it carries the label.
          # A push to a release branch always runs it, so a merge is still
          # checked even if the pull request never asked for it.
          REQUESTED: ${{ github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'run-e2e') }}
        run: |
          if [ "$REQUESTED" != "true" ]; then
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=End-to-end tests skipped::Add the run-e2e label to this pull request to run them. They take about three runner-minutes per shard, so they are opt-in; a push to ${{ github.event.repository.default_branch }} or testing/commerce-deployment always runs them."
          elif [ -z "$STORE_DOMAIN" ] || [ -z "$STOREFRONT_TOKEN" ]; then
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=End-to-end tests skipped::Set repository secrets SHOPIFY_STORE_DOMAIN and SHOPIFY_STOREFRONT_ACCESS_TOKEN to run them. Without a reachable store the suite fails rather than skipping, so the jobs don't start."
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi

  # The suite split three ways, each shard on its own runner. A 2-core runner
  # is CPU-bound, so more workers on one runner barely helped (8:00 -> 6:56 of
  # tests); separate runners each bring their own cores. Every shard repeats
  # the install and build (~3 min), which is the cost of the shorter wall time.
  e2e:
    name: End-to-end (${{ matrix.shard }}/${{ strategy.job-total }})
    needs: e2e-guard
    if: needs.e2e-guard.outputs.configured == 'true'
    runs-on: ubuntu-latest
    # The suite builds the app and starts it before the first test
    timeout-minutes: 30
    strategy:
      # Let every shard finish, so one failure doesn't hide the others
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      # Both projects are headless Chromium (Desktop Chrome and Pixel 7), so the
      # headless shell is the only browser needed. No --with-deps: the runner
      # image already ships every library Chromium needs, and the only extra
      # packages it pulled were fallback fonts (CJK, Thai, Unifont) that took
      # ~8 minutes from a slow apt mirror. No spec compares screenshots, so
      # those fonts can't change a result. If a runner image update drops a
      # library, apt-get install that one package instead of restoring this.
      - run: pnpm exec playwright install chromium --only-shell

      # The same docker-compose containers developers run locally. Playwright
      # then migrates and empties the test database before it builds the app
      # (playwright.config.ts), so the suite runs unseeded, as locally.
      - name: Start the database
        run: docker compose up -d --wait

      # playwright.config.ts builds and starts the app itself. CI is set by the
      # runner, which turns on forbidOnly, two retries, the GitHub reporter and
      # the blob reporter the merge job below combines.
      - name: Run Playwright
        env:
          SHOPIFY_STORE_DOMAIN: ${{ secrets.SHOPIFY_STORE_DOMAIN }}
          SHOPIFY_STOREFRONT_ACCESS_TOKEN: ${{ secrets.SHOPIFY_STOREFRONT_ACCESS_TOKEN }}
          # Optional: an unset repository variable arrives as an empty
          # string rather than being absent, which e2e/helpers.ts now falls
          # back on, so leaving it undefined selects the default collection.
          E2E_COLLECTION: ${{ vars.E2E_COLLECTION }}
          # DATABASE_URL comes from playwright.config.ts (the local test
          # database). No other admin variables: the app builds and serves
          # without them, and the suite never opens an admin page.
        run: pnpm exec playwright test --shard=${{ matrix.shard }}/${{ strategy.job-total }}

      # Uploaded whether or not the shard passed, so the merge job always has
      # every shard's results
      - name: Upload this shard's results
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: blob-report-${{ matrix.shard }}
          path: blob-report/
          retention-days: 1

  # Combines the shards into one HTML report, so a failure is read in one
  # place rather than hunted for across three runs
  e2e-report:
    name: End-to-end report
    needs: e2e
    if: ${{ !cancelled() && (needs.e2e.result == 'success' || needs.e2e.result == 'failure') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - uses: actions/download-artifact@v8
        with:
          pattern: blob-report-*
          path: all-blob-reports
          merge-multiple: true

      - name: Merge the shard reports
        run: pnpm exec playwright merge-reports --reporter html ./all-blob-reports

      - name: Upload the report
        if: needs.e2e.result == 'failure'
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14
